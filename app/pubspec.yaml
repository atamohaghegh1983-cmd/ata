name: hamshagerdi
description: "اپ موبایل همشاگردی — مدرسه و کلاس برای معلم، والدین، دانش‌آموز و مدیر"
publish_to: 'none'

# versionName+versionCode — versionCode در GitHub Actions با شماره‌ی اجرا جایگزین می‌شود
version: 0.7.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  shamsi_date: ^1.1.1
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.4
  flutter_widget_from_html_core: ^0.17.4
  share_plus: ^13.3.1
  file_picker: ^13.4.0
  archive: ^4.7.1
  xml: ^7.1.0
  crypto: ^3.0.8
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-FD-Regular.ttf
        - asset: assets/fonts/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf

# آیکون اپ: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#FFF8F2"
  adaptive_icon_foreground: assets/branding/icon_fg.png
  min_sdk_android: 24

# صفحه‌ی شروع: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF8F2"
  image: assets/branding/splash.png
  android_12:
    color: "#FFF8F2"
    image: assets/branding/splash.png
  ios: false
  web: false
